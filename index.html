
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>創新科技有限公司｜官方網站</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  scroll-behavior: smooth;
}
body {
  font-family: "Microsoft JhengHei", sans-serif;
  color: #24344d;
  line-height: 1.8;
}
header {
  background: #ffffff;
  padding: 18px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 12px #00000010;
  position: sticky;
  top: 0;
  z-index: 10;
}
.logo {
  font-size: 22px;
  font-weight: bold;
  color: #1765a8;
}
nav a {
  text-decoration: none;
  color: #34495e;
  margin-left: 25px;
  font-weight: bold;
}
nav a:hover {
  color: #2385d1;
}
.hero {
  background: linear-gradient(135deg,#174b80,#318ac5);
  color: white;
  text-align: center;
  padding: 110px 20px;
}
.hero h1 {
  font-size: 42px;
  margin-bottom: 20px;
}
.hero p {
  font-size: 19px;
  margin-bottom: 30px;
}
.btn {
  display: inline-block;
  background: white;
  color: #1765a8;
  padding: 12px 32px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
}
section {
  padding: 75px 10%;
  text-align: center;
}
section h2 {
  font-size: 30px;
  margin-bottom: 18px;
  color: #1765a8;
}
.intro {
  background: #f4f8fc;
}
.cards {
  display: flex;
  gap: 25px;
  margin-top: 35px;
  justify-content: center;
  flex-wrap: wrap;
}
.card {
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 18px #0000000d;
  flex: 1;
  min-width: 220px;
}
.card h3 {
  color: #1765a8;
  margin-bottom: 12px;
}
.contact {
  background: #f4f8fc;
}
form {
  max-width: 550px;
  margin: 30px auto 0;
  text-align: left;
}
form label {
  display: block;
  margin: 12px 0 5px;
  font-weight: bold;
}
input, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccd7e2;
  border-radius: 7px;
  font-size: 16px;
}
textarea {
  height: 130px;
}
button {
  margin-top: 18px;
  background: #1765a8;
  color: white;
  padding: 13px 35px;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  cursor: pointer;
}
button:hover {
  background: #318ac5;
}
footer {
  background: #173b60;
  color: white;
  text-align: center;
  padding: 25px;
}
@media(max-width:600px) {
  header {
    flex-direction: column;
    gap: 12px;
  }
  nav a {
    margin: 0 8px;
  }
  .hero h1 {
    font-size: 30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">創新科技有限公司</div>
  <nav>
    <a href="#home">首頁</a>
    <a href="#about">公司介紹</a>
    <a href="#service">服務項目</a>
    <a href="#contact">聯絡我們</a>
  </nav>
</header>

<div class="hero" id="home">
  <h1>專業創新，創造無限可能</h1>
  <p>以科技與創意，打造更美好的未來</p>
  <a href="#about" class="btn">認識我們</a>
</div>

<section class="intro" id="about">
  <h2>關於我們</h2>
  <p>
    創新科技有限公司致力於提供專業、優質的服務。
    我們重視客戶需求，持續創新與成長，
    以專業能力協助客戶創造更多價值。
  </p>
</section>

<section id="service">
  <h2>我們的服務</h2>
  <div class="cards">
    <div class="card">
      <h3>專業服務</h3>
      <p>提供專業諮詢與完善的服務品質。</p>
    </div>
    <div class="card">
      <h3>創新技術</h3>
      <p>運用創新思維，打造優質解決方案。</p>
    </div>
    <div class="card">
      <h3>客戶支持</h3>
      <p>重視每位客戶的需求與服務體驗。</p>
    </div>
  </div>
</section>

<section class="contact" id="contact">
  <h2>聯絡我們</h2>
  <p>歡迎留下您的資料，我們將盡快與您聯繫。</p>

 <form action="https://formsubmit.co/61113228@gm.chihlee.edu.tw" method="POST">

  <input type="hidden" name="_subject" value="網站收到新的聯絡訊息">

  <input type="hidden" name="_template" value="table">

  <input type="text" name="_honey" style="display:none">
    <label>姓名</label>
    <input type="text" name="name" placeholder="請輸入姓名" required>

    <label>電話</label>
    <input type="tel" name="phone" placeholder="請輸入電話" required>

    <label>Email</label>
    <input type="email" name="email" placeholder="請輸入電子信箱" required>

    <label>聯絡內容</label>
    <textarea name="message" placeholder="請輸入您的訊息" required></textarea>

    <button type="submit">送出資料</button>
  </form>
  <p id="result"></p>
</section>

<footer>
  <p>© 2026 創新科技有限公司 All Rights Reserved.</p>
</footer>



</body>
</html>
